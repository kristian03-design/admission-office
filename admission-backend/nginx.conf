# ============================================================
# Nginx configuration for Admission Office API
# Place in: /etc/nginx/sites-available/admission-api
# Symlink:  ln -s /etc/nginx/sites-available/admission-api /etc/nginx/sites-enabled/
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # Redirect HTTP to HTTPS in production
    # return 301 https://$host$request_uri;

    root /var/www/admission-backend/public;
    index index.php;

    # ── Security headers ──────────────────────────────────────
    add_header X-Frame-Options          "DENY"                        always;
    add_header X-Content-Type-Options   "nosniff"                     always;
    add_header X-XSS-Protection         "1; mode=block"               always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # ── File upload size ──────────────────────────────────────
    client_max_body_size 12M;

    # ── API routes ────────────────────────────────────────────
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ───────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass   unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_read_timeout 60;
    }

    # ── Block access to sensitive files ──────────────────────
    location ~* \.(env|log|sql|md|lock|gitignore)$ {
        deny all;
    }

    # ── Block access to non-public directories ────────────────
    location ~ ^/(app|config|database|routes|storage)/ {
        deny all;
    }

    # ── Gzip compression ─────────────────────────────────────
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 256;

    # ── Logging ───────────────────────────────────────────────
    access_log /var/log/nginx/admission-api.access.log;
    error_log  /var/log/nginx/admission-api.error.log;
}

